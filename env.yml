name: ibeat_cyst
channels:
  - pytorch
  - nvidia  # Add this if you have an NVIDIA GPU
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - numpy
  - scipy
  - scikit-image
  - tqdm
  - joblib
  - pip

  - pip:
      - -e .    # This installs the pipeline from source
      - pydmr   
      - vreg
      - dbdicom
      - miblab_plot
      - miblab
      - numpyradiomics